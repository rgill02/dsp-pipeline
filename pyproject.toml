[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsppipeline"
version = "1.0.0"
authors = [
  { name="Ryan Gill", email="ryansoftwaredev@gmail.com" },
]
description = "A multi-process DSP pipeline framework using queues"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Add any external DSP libraries you use, like numpy or scipy
    # "numpy>=1.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]
